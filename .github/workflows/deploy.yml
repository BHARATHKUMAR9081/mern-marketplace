name: mern-marketplace-build-deploy-verify

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: 8000
  PUBLIC_URL: http://13.234.150.98
  PUBLIC_IP: 13.234.150.98

jobs:
  build-and-push:
    name: Build, Diagnose, Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (per package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics - toolchain and manifest verification
        run: |
          set -e
          echo "--- node/npm versions (expect node 13.12.0 / npm 6.14.4) ---"
          node --version
          npm --version
          echo "--- package.json scripts ---"
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts, null, 2)); console.log('main:', p.main); console.log('engines:', JSON.stringify(p.engines));"
          echo "--- required source tree ---"
          ls -la
          test -f package.json
          test -d client
          test -d server
          test -d config
          test -f template.js
          test -f webpack.config.client.production.js
          test -f webpack.config.server.js
          test -f client/main.js
          test -f client/App.js
          test -f server/server.js
          test -f client/assets/images/default.png

      - name: Install dependencies (legacy peer deps, per Dockerfile deps stage)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production webpack build (client bundle + SSR server bundle)
        run: npm run build

      - name: Build diagnostics - verify webpack artifacts
        run: |
          set -e
          echo "--- dist/ contents ---"
          ls -la dist/
          test -f dist/server.generated.js
          test -f dist/bundle.js
          echo "--- server bundle magic bytes (CommonJS2 sanity) ---"
          head -c 400 dist/server.generated.js || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: AWS CLI - authenticate with static credentials
        run: |
          aws sts get-caller-identity
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URI"

      - name: Build production image (multi-stage Dockerfile at repo root) and push to ECR
        run: |
          set -e
          docker build -t "$FULL_IMAGE" -t "$ECR_REPOSITORY_URI:latest" -f Dockerfile .
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Build diagnostics - image manifest and entrypoint inspection
        run: |
          docker images "$ECR_REPOSITORY_URI"
          docker inspect "$FULL_IMAGE" --format 'ExposedPorts={{json .Config.ExposedPorts}} Cmd={{json .Config.Cmd}} User={{.Config.User}} Workdir={{.Config.WorkingDir}}'

  deploy-and-verify:
    name: Deploy to EC2 (Docker) and Verify Health
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image URI from build job
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Deploying image: ${IMAGE_URI}"

      - name: Fetch runtime secrets from AWS Secrets Manager
        run: |
          set -e
          echo "--- fetching ${SECRETS_MANAGER_ID} ---"
          aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text > /tmp/app-secrets.json
          echo "--- injecting MONGO_URI / JWT_SECRET / STRIPE_TEST_SECRET_KEY ---"
          MONGO_URI="$(node -e "const s=require('/tmp/app-secrets.json'); const v=s.MONGO_URI||s.mongoUri||s.mongodb_uri||s.mongo_uri||''; process.stdout.write(String(v))")"
          JWT_SECRET="$(node -e "const s=require('/tmp/app-secrets.json'); const v=s.JWT_SECRET||s.jwtSecret||s.jwt_secret||''; process.stdout.write(String(v))")"
          STRIPE_TEST_SECRET_KEY="$(node -e "const s=require('/tmp/app-secrets.json'); const v=s.STRIPE_TEST_SECRET_KEY||s.stripeSecretKey||s.stripe_test_secret_key||''; process.stdout.write(String(v))")"
          {
            echo "MONGO_URI<<EOF_MONGO"
            echo "$MONGO_URI"
            echo "EOF_MONGO"
            echo "JWT_SECRET<<EOF_JWT"
            echo "$JWT_SECRET"
            echo "EOF_JWT"
            echo "STRIPE_TEST_SECRET_KEY<<EOF_STRIPE"
            echo "$STRIPE_TEST_SECRET_KEY"
            echo "EOF_STRIPE"
          } >> "$GITHUB_ENV"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:${IMAGE_TAG}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e NODE_ENV=production -e PORT=8000 -e MONGO_URI=${MONGO_URI} -e JWT_SECRET=${JWT_SECRET} -e STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY} $IMAGE_URI",
              "sleep 10",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          echo "--- ssm payload written ---"
          cat /tmp/ssm-params.json

      - name: Send deployment command via SSM (file-based parameters)
        run: |
          set -e
          EXPORTS_FILE="/tmp/deploy-exports.sh"
          {
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}"
            echo "MONGO_URI=$(printf '%s' "$MONGO_URI" | base64 -w0)"
            echo "JWT_SECRET=$(printf '%s' "$JWT_SECRET" | base64 -w0)"
            echo "STRIPE_TEST_SECRET_KEY=$(printf '%s' "$STRIPE_TEST_SECRET_KEY" | base64 -w0)"
          } > "$EXPORTS_FILE"
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --parameters "file:///tmp/deploy-exports.sh" 2>/dev/null || true
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text > /tmp/command-id.txt
          # The valid invocation (single --parameters with file:// JSON). Retry-safe loop:
          if [ ! -s /tmp/command-id.txt ]; then
            echo "Retrying SSM send-command with file payload only"
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --document-name "AWS-RunShellScript" \
              --parameters file:///tmp/ssm-params.json \
              --query "Command.CommandId" --output text > /tmp/command-id.txt
          fi
          COMMAND_ID=$(cat /tmp/command-id.txt)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status --output text || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command succeeded."
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out waiting for success"
          exit 1

      - name: Verify deployment - HTTP 200 health check against public URL
        run: |
          set -e
          echo "--- polling ${PUBLIC_URL} for HTTP 200 (SSR Express server on port 8000 via host port 80) ---"
          SUCCESS=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body.html -w "%{http_code}" "${PUBLIC_URL}/" || echo "000")
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              SUCCESS=1
              break
            fi
            sleep 10
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Health check failed: never received HTTP 200 from ${PUBLIC_URL}"
            exit 1
          fi
          echo "--- health check PASSED (HTTP 200) ---"
          head -c 500 /tmp/health-body.html || true

      - name: Verify API endpoint responds (Express JSON API)
        run: |
          set -e
          CODE=$(curl -s -o /tmp/api-body.json -w "%{http_code}" "${PUBLIC_URL}/api/products/latest" || echo "000")
          echo "GET /api/products/latest -> HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "API health check failed"
            exit 1
          fi
          echo "--- API health check PASSED ---"
          head -c 300 /tmp/api-body.json || true

      - name: Deployment summary
        run: |
          {
            echo "## mern-marketplace deployment"
            echo "- Image: ${{ needs.build-and-push.outputs.image_uri }}"
            echo "- Instance: i-0bd9cad8485cd0392 (ap-south-1)"
            echo "- Public URL: http://13.234.150.98 (host :80 -> container :8000)"
            echo "- Health: HTTP 200 verified"
          } >> "$GITHUB_STEP_SUMMARY"