name: mern-marketplace-build-deploy-verify

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: 8000
  PUBLIC_URL: http://13.234.150.98

jobs:
  build-push-deploy-verify:
    name: Build, push to ECR, deploy to EC2 (Docker), verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics - toolchain and repository layout
        run: |
          set -e
          echo "=== Node / npm versions ==="
          node --version
          npm --version
          echo "=== Repository root ==="
          ls -la
          echo "=== Docker build context (dockerfile_path=.) ==="
          test -f package.json
          test -f template.js
          test -d client
          test -d server
          test -d config
          echo "=== package.json scripts ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts,null,2)); console.log('main:', p.main); console.log('engines:', JSON.stringify(p.engines))"

      - name: Install dependencies (legacy peer deps for Node 13 toolchain)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production bundles (client bundle + SSR server bundle)
        run: npm run build

      - name: Build diagnostics - verify webpack outputs
        run: |
          set -e
          echo "=== dist/ contents ==="
          ls -la dist/
          test -f dist/server.generated.js
          test -f dist/bundle.js || true
          echo "server.generated.js size:"
          stat -c%s dist/server.generated.js || wc -c < dist/server.generated.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to ECR (AWS CLI, static credentials)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build production Docker image (context ., multi-stage Dockerfile)
        run: |
          set -e
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$SHORT_SHA"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          echo "Built images: $FULL_IMAGE and $LATEST_IMAGE"

      - name: Push image to ECR
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push "$ECR_REPOSITORY_URI:$SHORT_SHA"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Deploy to EC2 instance via SSM send-command (file-based parameters)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="$ECR_REPOSITORY_URI:$SHORT_SHA"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:latest",
              "docker stop app || true",
              "docker rm app || true",
              "SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/mern-marketplace/secrets --region ap-south-1 --query SecretString --output text)",
              "MONGO_URI=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"MONGO_URI\", d.get(\"mongoUri\",\"\")))')",
              "JWT_SECRET=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET\", d.get(\"jwtSecret\",\"\")))')",
              "STRIPE_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"STRIPE_TEST_SECRET_KEY\", d.get(\"stripeSecretKey\",\"\")))')",
              "docker run -d --restart always --name app -p 80:8000 -e NODE_ENV=production -e PORT=8000 -e MONGO_URI=\"$MONGO_URI\" -e JWT_SECRET=\"$JWT_SECRET\" -e STRIPE_TEST_SECRET_KEY=\"$STRIPE_KEY\" 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:latest",
              "sleep 5",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-commands \
            --command-id "$COMMAND_ID" \
            --region "$AWS_REGION" \
            --query "Commands[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed; fetching output:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" || true
            exit 1
          fi

      - name: Verify deployment - HTTP 200 health check on public URL
        run: |
          set -e
          echo "Waiting for application to come up at $PUBLIC_URL ..."
          ATTEMPTS=30
          until [ "$ATTEMPTS" -le 0 ]; do
            HTTP_CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "Attempt remaining=$ATTEMPTS HTTP=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            ATTEMPTS=$((ATTEMPTS-1))
            sleep 10
          done
          FINAL_CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$PUBLIC_URL")
          echo "Final HTTP status: $FINAL_CODE"
          head -c 500 /tmp/health.html || true
          if [ "$FINAL_CODE" != "200" ]; then
            echo "Health check failed: expected HTTP 200, got $FINAL_CODE"
            exit 1
          fi
          echo "Deployment verified: $PUBLIC_URL returned HTTP 200"