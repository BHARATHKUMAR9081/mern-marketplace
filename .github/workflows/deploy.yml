name: mern-marketplace-build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: "8000"
  PUBLIC_URL: http://13.234.150.98

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics
        run: |
          set -euo pipefail
          echo "--- toolchain ---"
          node --version
          npm --version
          echo "--- repository tree (top level) ---"
          ls -la
          echo "--- declared engines ---"
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.engines)); console.log('main:', p.main); console.log('build:', p.scripts.build); console.log('start:', p.scripts.start)"
          test -f webpack.config.client.production.js || { echo "MISSING webpack.config.client.production.js"; exit 1; }
          test -f webpack.config.server.js || { echo "MISSING webpack.config.server.js"; exit 1; }
          test -f template.js || { echo "MISSING template.js (SSR shell)"; exit 1; }
          test -f config/config.js || { echo "MISSING config/config.js"; exit 1; }
          test -f client/assets/images/default.png || { echo "MISSING client/assets/images/default.png"; exit 1; }

      - name: Install dependencies (legacy peer deps)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production webpack build (client bundle + SSR server bundle)
        run: npm run build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          ls -la dist/
          test -s dist/server.generated.js || { echo "dist/server.generated.js missing"; exit 1; }
          test -s dist/bundle.js || { echo "dist/bundle.js missing"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${SHORT_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_uri=${FULL_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "Building image: ${FULL_IMAGE}"

      - name: Build Docker image (multi-stage production Dockerfile at repo root)
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t "$FULL_IMAGE" -t "$ECR_REPOSITORY_URI:latest" .
          docker image inspect "$FULL_IMAGE" --format 'Image {{.Id}} size={{.Size}}'
          docker run --rm --entrypoint node "$FULL_IMAGE" -e "console.log('container node', process.version)"

      - name: Export image artifact for inspection
        run: |
          set -euo pipefail
          docker save "$FULL_IMAGE" -o /tmp/mern-marketplace-image.tar
          ls -la /tmp/mern-marketplace-image.tar

  deploy:
    name: Push to ECR and deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve runtime secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$AWS_REGION" --query SecretString --output text)"
          MONGO_URI="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("MONGO_URI") or d.get("mongoUri") or d.get("MONGO_URL") or "")')"
          JWT_SECRET="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("JWT_SECRET") or d.get("jwtSecret") or "")')"
          STRIPE_KEY="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("STRIPE_TEST_SECRET_KEY") or d.get("stripeSecret") or "")')"
          {
            echo "MONGO_URI=${MONGO_URI}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "STRIPE_TEST_SECRET_KEY=${STRIPE_KEY}"
          } >> "$GITHUB_ENV"
          echo "Runtime secrets resolved from Secrets Manager (keys only logged, never values)."

      - name: ECR login and push (static AWS credentials via CLI)
        run: |
          set -euo pipefail
          FULL_IMAGE="${{ needs.build.outputs.image_uri }}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed ${FULL_IMAGE} and :latest"

      - name: Write SSM command payload to file
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:IMAGE_TAG_PLACEHOLDER",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "SECRET_STRING=$(aws secretsmanager get-secret-value --secret-id deptic/mern-marketplace/secrets --region $AWS_REGION --query SecretString --output text)",
              "MONGO_URI=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"MONGO_URI\") or d.get(\"mongoUri\") or \"\")')",
              "JWT_SECRET=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET\") or d.get(\"jwtSecret\") or \"\")')",
              "STRIPE_KEY=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"STRIPE_TEST_SECRET_KEY\") or d.get(\"stripeSecret\") or \"\")')",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e NODE_ENV=production -e PORT=8000 -e MONGO_URI=\"$MONGO_URI\" -e JWT_SECRET=\"$JWT_SECRET\" -e STRIPE_TEST_SECRET_KEY=\"$STRIPE_KEY\" $IMAGE_URI",
              "for i in $(seq 1 30); do if curl -sf -o /dev/null http://localhost:80/; then echo 'container healthy on port 80'; exit 0; fi; sleep 2; done",
              "echo 'container health check failed'; docker logs app --tail 50; exit 1"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" /tmp/ssm-params.json
          echo "--- ssm-params.json ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: Show remote deployment output
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text

  verify:
    name: Public health check (HTTP 200 only)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check http://13.234.150.98 until HTTP 200
        run: |
          set -euo pipefail
          URL="http://13.234.150.98"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "$URL" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Health check succeeded with HTTP 200"
              head -c 400 /tmp/health-body || true
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: never received HTTP 200 from ${URL}"
          exit 1