name: mern-marketplace-build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: "8000"
  HOST_PORT: "80"
  PUBLIC_URL: http://13.234.150.98

jobs:
  build-and-push:
    name: Build, diagnose, and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics - toolchain and manifest verification
        run: |
          set -e
          echo "::group::Toolchain versions"
          node --version
          npm --version
          echo "::endgroup::"
          echo "::group::package.json evidence"
          test -f package.json
          node -e "const p=require('./package.json'); console.log('name='+p.name); console.log('version='+p.version); console.log('main='+p.main); console.log('build='+p.scripts.build); console.log('start='+p.scripts.start); console.log('engines.node='+p.engines.node)"
          echo "::endgroup::"
          echo "::group::Repository layout (webpack/babel/template/runtime assets)"
          ls -la
          test -f webpack.config.client.production.js
          test -f webpack.config.server.js
          test -f template.js
          test -d client && test -d server && test -d config
          test -f client/main.js && test -f client/App.js
          test -f server/server.js && test -f server/controllers/bidding.controller.js
          test -f client/assets/images/default.png
          echo "::endgroup::"

      - name: Install dependencies (legacy peer deps, per Dockerfile deps stage)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production build (client bundle + SSR server bundle)
        run: npm run build

      - name: Build diagnostics - verify webpack outputs
        run: |
          set -e
          echo "::group::dist artifacts"
          test -d dist
          ls -la dist
          test -f dist/server.generated.js
          test -f dist/bundle.js
          node --check dist/server.generated.js && echo "server.generated.js syntax OK"
          echo "::endgroup::"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag and URI
        id: meta
        run: |
          set -e
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Build and push production image (dockerfile_path '.', port 8000)
        run: |
          set -e
          docker build \
            -t "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" \
            -t "${ECR_REPOSITORY_URI}:latest" \
            -f Dockerfile \
            .
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URI}:latest"

      - name: Build diagnostics - image inspection
        run: |
          set -e
          docker images "${ECR_REPOSITORY_URI}"
          docker image inspect "${IMAGE_URI}" --format 'Image {{.Id}} size={{.Size}}'
          docker image inspect "${IMAGE_URI}" --format 'ExposedPorts={{json .Config.ExposedPorts}}'
          docker image inspect "${IMAGE_URI}" --format 'Cmd={{json .Config.Cmd}}'
          docker image inspect "${IMAGE_URI}" --format 'User={{.Config.User}}'

  deploy-and-verify:
    name: Deploy to EC2 Docker via SSM and verify health
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy image to EC2 instance via SSM RunShellScript
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=${AWS_REGION}",
              "aws secretsmanager get-secret-value --secret-id ${SECRETS_MANAGER_ID} --region ${AWS_REGION} --query SecretString --output text > /tmp/app.env.json",
              "export MONGO_URI=\$(node -e \"console.log(JSON.parse(require('fs').readFileSync('/tmp/app.env.json')).MONGO_URI || '')\")",
              "export JWT_SECRET=\$(node -e \"console.log(JSON.parse(require('fs').readFileSync('/tmp/app.env.json')).JWT_SECRET || '')\")",
              "export STRIPE_TEST_SECRET_KEY=\$(node -e \"console.log(JSON.parse(require('fs').readFileSync('/tmp/app.env.json')).STRIPE_TEST_SECRET_KEY || '')\")",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p ${HOST_PORT}:${CONTAINER_PORT} --name app -e NODE_ENV=production -e PORT=${CONTAINER_PORT} -e MONGO_URI=\"\$MONGO_URI\" -e JWT_SECRET=\"\$JWT_SECRET\" -e STRIPE_TEST_SECRET_KEY=\"\$STRIPE_TEST_SECRET_KEY\" ${IMAGE_URI}"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status ${STATUS}"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: Health check - require HTTP 200 on public URL
        run: |
          set -e
          echo "Polling ${PUBLIC_URL} for HTTP 200 (server binds container port ${CONTAINER_PORT}, host port ${HOST_PORT})..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "${PUBLIC_URL}/" || true)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 300 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed - never received HTTP 200 from ${PUBLIC_URL}"
          exit 1

      - name: Verify API endpoints respond
        run: |
          set -e
          for path in "/api/products/latest" "/api/shops" "/api/auctions"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL}${path}" || true)
            echo "GET ${path} -> HTTP ${CODE}"
            if [ "$CODE" != "200" ]; then
              echo "::error::API verification failed for ${path} (HTTP ${CODE})"
              exit 1
            fi
          done
          echo "All API verification checks returned HTTP 200"