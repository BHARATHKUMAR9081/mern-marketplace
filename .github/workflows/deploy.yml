name: mern-marketplace-build-deploy-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  CONTAINER_PORT: "8000"
  PUBLIC_URL: http://13.234.150.98
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets

jobs:
  build:
    name: Build diagnostics and webpack production bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics
        run: |
          set -e
          echo "=== Node / npm versions ==="
          node --version
          npm --version
          echo "=== package.json engines ==="
          node -e "console.log(JSON.stringify(require('./package.json').engines, null, 2))"
          echo "=== Repository tree (top level) ==="
          ls -la
          echo "=== Client entrypoints ==="
          ls -la client/main.js client/App.js
          echo "=== Server entrypoint ==="
          ls -la server/server.js
          echo "=== Webpack configs ==="
          ls -la webpack.config.client.production.js webpack.config.server.js

      - name: Install dependencies (legacy peer deps for Node 13 toolchain)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run production build (client bundle + SSR server bundle)
        run: npm run build

      - name: Verify build artifacts
        run: |
          set -e
          echo "=== dist listing ==="
          ls -la dist
          test -f dist/server.generated.js || { echo "MISSING dist/server.generated.js"; exit 1; }
          test -f dist/bundle.js || { echo "MISSING dist/bundle.js (client bundle)"; exit 1; }
          echo "Build artifacts OK"

  deploy:
    name: Deploy to EC2 Docker via ECR and SSM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Install dependencies and build (needed for Docker build context validation)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "$PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "ECR login OK for $ECR_REGISTRY"

      - name: Build and push Docker image
        run: |
          set -e
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          LATEST_IMAGE="${ECR_REPOSITORY_URI}:latest"
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" -f Dockerfile .
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"
          echo "Pushed $FULL_IMAGE and $LATEST_IMAGE"

      - name: Retrieve runtime secrets from AWS Secrets Manager
        run: |
          set -e
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$AWS_REGION" --query SecretString --output text)
          MONGO_URI=$(echo "$SECRET_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);process.stdout.write(s.MONGO_URI||s.mongoUri||'')})")
          JWT_SECRET=$(echo "$SECRET_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);process.stdout.write(s.JWT_SECRET||s.jwtSecret||'')})")
          STRIPE_TEST_SECRET_KEY=$(echo "$SECRET_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);process.stdout.write(s.STRIPE_TEST_SECRET_KEY||s.stripe_test_secret_key||'')})")
          {
            echo "MONGO_URI<<EOFMONGO"
            echo "$MONGO_URI"
            echo "EOFMONGO"
            echo "JWT_SECRET<<EOFJWT"
            echo "$JWT_SECRET"
            echo "EOFJWT"
            echo "STRIPE_TEST_SECRET_KEY<<EOFSTRIPE"
            echo "$STRIPE_TEST_SECRET_KEY"
            echo "EOFSTRIPE"
          } >> "$GITHUB_ENV"
          echo "Secrets retrieved from Secrets Manager"

      - name: Send SSM command to EC2 instance (pull and run container)
        run: |
          set -e
          IMAGE_URI="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull IMAGE_URI_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e NODE_ENV=production -e PORT=8000 -e MONGO_URI=MONGO_URI_PLACEHOLDER -e JWT_SECRET=JWT_SECRET_PLACEHOLDER -e STRIPE_TEST_SECRET_KEY=STRIPE_PLACEHOLDER IMAGE_URI_PLACEHOLDER"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" /tmp/ssm-params.json
          sed -i "s|MONGO_URI_PLACEHOLDER|${MONGO_URI}|g" /tmp/ssm-params.json
          sed -i "s|JWT_SECRET_PLACEHOLDER|${JWT_SECRET}|g" /tmp/ssm-params.json
          sed -i "s|STRIPE_PLACEHOLDER|${STRIPE_TEST_SECRET_KEY}|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "Waiting for SSM command completion..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query Status --output text || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM command succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then echo "SSM command failed with status $STATUS"; exit 1; fi
            sleep 10
          done
          echo "SSM command timed out"; exit 1

  verify:
    name: Verify deployment health over public URL
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          echo " probing ${PUBLIC_URL} "
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "${PUBLIC_URL}/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 300 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200"
          exit 1

      - name: Verify API endpoints respond
        run: |
          set -e
          CODE_SHOPS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_URL}/api/shops" || true)
          CODE_PRODUCTS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_URL}/api/products/latest" || true)
          echo "GET /api/shops -> $CODE_SHOPS"
          echo "GET /api/products/latest -> $CODE_PRODUCTS"
          if [ "$CODE_SHOPS" = "200" ] && [ "$CODE_PRODUCTS" = "200" ]; then
            echo "API verification passed"
          else
            echo "API verification failed"
            exit 1
          fi