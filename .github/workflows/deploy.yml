name: mern-marketplace-build-deploy-verify

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  INSTANCE_ID: i-0bd9cad8485cd0392
  PUBLIC_URL: http://13.234.150.98
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: 8000

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build diagnostics - install dependencies and bundle client/server
        run: |
          set -e
          echo "=== Node/NPM versions ==="
          node --version
          npm --version
          echo "=== npm install ==="
          npm install --no-audit --no-fund
          echo "=== Webpack production build (client + server bundles into dist/) ==="
          npm run build || echo "::warning::webpack build reported issues; continuing with diagnostics"
          echo "=== dist/ contents ==="
          ls -la dist/ || true
          echo "=== package.json scripts ==="
          node -e "console.log(JSON.stringify(require('./package.json').scripts, null, 2))"

      - name: Ensure Docker build context files exist
        run: |
          set -e
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile missing from repository root; generating runtime Dockerfile from evidence"
            cat > Dockerfile << 'DOCKERFILE'
          FROM node:13-alpine
          WORKDIR /app
          COPY package.json ./
          RUN npm install --production --no-audit --no-fund
          COPY . .
          RUN npm run build || true
          EXPOSE 8000
          CMD ["npm", "run", "start"]
          DOCKERFILE
          fi
          if [ ! -f .dockerignore ]; then
            printf '%s\n' node_modules dist data npm-debug.log .git > .dockerignore
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: AWS CLI - login to ECR with static credentials
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URI"

      - name: Build image and push to ECR
        run: |
          set -e
          docker build -t "$IMAGE_URI" -t "$ECR_REPOSITORY_URI:latest" .
          docker push "$IMAGE_URI"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed $IMAGE_URI"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: AWS CLI - ensure deployment tag env
        run: |
          echo "IMAGE_URI=$ECR_REPOSITORY_URI:${{ needs.build-and-push.outputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:${{ needs.build-and-push.outputs.image_tag }}",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/mern-marketplace/secrets --region ap-south-1 --query SecretString --output text)",
              "BACKEND_PORT=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"BACKEND_PORT\",\"8000\"))')",
              "JWT_SECRET=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"JWT_SECRET\",\"\"))')",
              "MONGO_URI=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"MONGO_URI\",\"\"))')",
              "PORT=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"PORT\",\"8000\"))')",
              "STRIPE_TEST_SECRET_KEY=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"STRIPE_TEST_SECRET_KEY\",\"\"))')",
              "docker run -d --restart always --name app -p 80:8000 -e PORT=$PORT -e BACKEND_PORT=$BACKEND_PORT -e MONGO_URI=$MONGO_URI -e JWT_SECRET=$JWT_SECRET -e STRIPE_TEST_SECRET_KEY=$STRIPE_TEST_SECRET_KEY $IMAGE_URI"
            ]
          }
          SSMPARAMS

      - name: AWS CLI - send SSM command to EC2 instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Sent SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: AWS CLI - wait for SSM command success
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify-health:
    name: Verify production health over HTTP
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          echo "Waiting for $PUBLIC_URL to return HTTP 200"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: no HTTP 200 received"
          exit 1