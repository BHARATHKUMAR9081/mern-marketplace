name: mern-marketplace-build-deploy-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace
  EC2_INSTANCE_ID: i-0bd9cad8485cd0392
  PUBLIC_URL: http://13.234.150.98
  SECRETS_MANAGER_ID: deptic/mern-marketplace/secrets
  CONTAINER_PORT: "8000"

jobs:
  build:
    name: Build diagnostics and webpack production bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Build diagnostics
        run: |
          set -e
          echo "=== Node / npm versions ==="
          node --version
          npm --version
          echo "=== package.json metadata ==="
          node -e "const p=require('./package.json'); console.log('name:', p.name); console.log('version:', p.version); console.log('main:', p.main); console.log('engines:', JSON.stringify(p.engines)); console.log('build script:', p.scripts.build); console.log('start script:', p.scripts.start)"
          echo "=== Repository layout ==="
          ls -la
          echo "=== Client entrypoints ==="
          test -f client/main.js && echo "client/main.js present"
          test -f client/App.js && echo "client/App.js present"
          echo "=== Server entrypoint ==="
          test -f server/server.js && echo "server/server.js present"
          echo "=== Webpack configs ==="
          test -f webpack.config.client.production.js && echo "webpack.config.client.production.js present"
          test -f webpack.config.server.js && echo "webpack.config.server.js present"

      - name: Install dependencies (legacy peer deps for React 16 / MUI 4)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run production webpack build (client bundle + SSR server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          set -e
          echo "=== dist contents ==="
          ls -la dist/
          test -f dist/server.generated.js && echo "dist/server.generated.js OK"
          test -f dist/bundle.js && echo "dist/bundle.js OK" || echo "dist/bundle.js not found, listing actual client bundle artifacts"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mern-marketplace-dist
          path: dist/

  deploy:
    name: Push image to ECR and deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 13 (engines from package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 13

      - name: Install dependencies and rebuild bundles for image context
        run: |
          set -e
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          ls -la dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          ECR_REPO="${ECR_REPOSITORY_URI#*/}"
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          echo "ECR_REPO=$ECR_REPO"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (context ., Dockerfile at repository root)
        run: |
          set -e
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_URI="$ECR_REPOSITORY_URI:latest"
          docker buildx build \
            --file Dockerfile \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --push \
            --build-arg NODE_ENV=production \
            --label "gitSha=$GITHUB_SHA" \
            --label "buildRun=$GITHUB_RUN_ID" \
            .
          echo "Pushed $IMAGE_URI and $LATEST_URI"

      - name: Fetch runtime secrets from AWS Secrets Manager
        run: |
          set -e
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$AWS_REGION" --query SecretString --output text)"
          MONGO_URI="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("MONGO_URI") or d.get("mongoUri") or d.get("MONGO_URL") or "")')"
          JWT_SECRET="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("JWT_SECRET") or d.get("jwtSecret") or "")')"
          STRIPE_KEY="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("STRIPE_TEST_SECRET_KEY") or d.get("stripeSecretKey") or "")')"
          {
            echo "MONGO_URI=$MONGO_URI"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "STRIPE_TEST_SECRET_KEY=$STRIPE_KEY"
          } >> "$GITHUB_ENV"
          echo "Runtime secrets loaded from Secrets Manager (values masked in logs)"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-marketplace:latest",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8000 -e PORT=8000 -e NODE_ENV=production -e MONGO_URI=\"$MONGO_URI\" -e JWT_SECRET=\"$JWT_SECRET\" -e STRIPE_TEST_SECRET_KEY=\"$STRIPE_TEST_SECRET_KEY\" $IMAGE_URI",
              "sleep 10",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          echo "SSM parameters file written"
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query Status --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed; output below"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
            exit 1
          fi

  verify:
    name: Health check public endpoint
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request'
    steps:
      - name: Wait for application startup (SSR server + Socket.io)
        run: sleep 20

      - name: Health check http://13.234.150.98 (must return HTTP 200)
        run: |
          set -e
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" http://13.234.150.98/ || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              head -c 500 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from http://13.234.150.98"
          exit 1